appId: com.nexopc.desktop
productName: Nexo PC
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
extraResources:
  - from: assets/icon.png
    to: icon.png
publish:
  provider: github
  releaseType: release
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - ia32
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  artifactName: ${productName}-Setup-${version}-${arch}.${ext}
