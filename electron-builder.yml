appId: com.nexopc.desktop
productName: Nexo PC
directories:
  output: release
files:
  - dist/**
  - dist-electron/**
extraResources:
  - from: assets/icon.png
    to: icon.png
  - from: assets/icon.ico
    to: icon.ico
publish:
  provider: github
  owner: JaviBarrientos17
  repo: nexo-pc-app
  releaseType: release
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  installerIcon: assets/icon.ico
  uninstallerIcon: assets/icon.ico
  artifactName: Nexo-PC-Setup-${version}-${arch}.${ext}
