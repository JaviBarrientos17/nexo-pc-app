name: Release Windows

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check and test
        run: |
          npm run lint
          npm test -- --run

      - name: Build app
        run: npm run build

      - name: Create release tag
        shell: pwsh
        run: |
          $version = (node -p "require('./package.json').version").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not read the package version." }
          $tag = "v$version"
          $remoteTag = git ls-remote --tags origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not check whether release tag $tag exists on origin." }
          if ($remoteTag) { throw "Release tag $tag already exists." }

          git tag $tag HEAD
          if ($LASTEXITCODE -ne 0) { throw "Could not create release tag $tag." }
          git push origin "refs/tags/$tag"
          if ($LASTEXITCODE -ne 0) { throw "Could not push release tag $tag to origin." }

      - name: Package Windows installer
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Validate and publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $installers = @(Get-ChildItem -Path "release" -Filter "*.exe" -File)
          if ($installers.Count -ne 1) {
            throw "Expected exactly one Windows installer in the release folder, found $($installers.Count)."
          }

          $version = (node -p "require('./package.json').version").Trim()
          if ($LASTEXITCODE -ne 0) { throw "Could not read the package version." }

          $metadata = Join-Path "release" "latest.yml"
          if (-not (Test-Path -LiteralPath $metadata -PathType Leaf)) {
            throw "electron-builder did not generate release/latest.yml."
          }

          $metadataContent = Get-Content -LiteralPath $metadata -Raw
          if ($metadataContent -notmatch "(?m)^version:\s*$([regex]::Escape($version))\s*$") {
            throw "release/latest.yml does not describe version $version."
          }

          $metadataUrls = [regex]::Matches($metadataContent, '(?m)^\s*-\s*url:\s*(?<url>\S+)\s*$')
          $referencedFiles = @($metadataUrls | ForEach-Object {
            [Uri]::UnescapeDataString($_.Groups["url"].Value.Trim('"', [char]39))
          })
          if ($referencedFiles -notcontains $installers[0].Name) {
            throw "release/latest.yml references [$($referencedFiles -join ', ')], not the Windows installer [$($installers[0].Name)]."
          }

          $blockmaps = @(Get-ChildItem -Path "release" -Filter "*.exe.blockmap" -File)
          if ($blockmaps.Count -ne 1) {
            throw "Expected exactly one Windows installer blockmap in the release folder, found $($blockmaps.Count)."
          }
          if ($blockmaps[0].Name -ne "$($installers[0].Name).blockmap") {
            throw "The Windows installer blockmap does not match the installer."
          }

          $tag = "v$version"
          $installerPath = $installers[0].FullName
          $blockmapPath = $blockmaps[0].FullName
          gh release create $tag `
            "$installerPath" `
            "$blockmapPath" `
            "$metadata" `
            --title "Nexo PC $version" `
            --notes "Nexo PC $version para Windows x64." `
            --verify-tag `
            --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish GitHub release $tag."
          }
